<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 
        label : to display the text for the input field
        input : to take input from the user 
    -->

    <form>

        <label for="fn">First Name : </label>
        <input type="text" id="fn" placeholder="First Name" required>
        
        <br><br>
        
        <label for="ln">Last Name : </label>
        <input type="text" id="ln" placeholder="Last Name" required>

        <br><br>
        <label for="email">Email : </label>
        <input type="email" id="email">

        <br><br>

        <label for="password">Password : </label>
        <input type="password" id="password">

        <br><br>

        <label for="age">Age :</label>
        <input type="number" id="age">

        <br><br>

        <label for="DOB">Date of Birth</label>
        <input type="date" name="" id="DOB">

        <br><br>

        <label for="gender">Gender :</label>
        <input type="radio" id="gender" name="gender">
        <label for="gender">Male</label>
        <input type="radio" id="gender" name="gender">
        <label for="gender">Female</label>


        <br><br>

        <label for="country">Country :</label>
        <select name="" id="country">
            <option value="">--Select any one--</option>
            <option value="">India</option> 
            <option value="">USA</option>
            <option value="">UK</option>
            <option value="">Australia</option>
        </select>

        <br><br>

        <label for="address">Address :</label>
        <textarea name="" id="address" cols="20" rows="10"></textarea>


        <br><br>

        <input type="submit">
        <input type="reset">



        <button value="submit">Complete the Reg</button>


    </form>

</body>
</html>
